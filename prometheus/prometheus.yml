global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'yaku'
    static_configs:
      - targets: ['172.16.48.10:9100']

  - job_name: 'kuntur'
    static_configs:
      - targets: ['172.16.48.7:9100']          

  - job_name: 'wayra'
    static_configs:
      - targets: ['172.16.48.8:9100']      

  - job_name: 'eureka'
    static_configs:
      - targets: ['172.16.48.9:9100']    

  - job_name: 'modbus_exporter'
    static_configs:
      - targets: ['172.16.48.127:9101']

  - job_name: 'snmp_ups'
    metrics_path: /snmp
    params:
      module: [if_mib]

    static_configs:
      - targets:
          - 172.16.48.100
          - 172.16.48.2
          - 172.16.48.3

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: snmp_exporter:9116

  - job_name: "cadvisor"
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'icmp'
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [icmp_check]
    static_configs:
      - targets:
          - 200.16.30.242
          - 172.16.48.127

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'http'
    scrape_interval: 5m
    metrics_path: /probe
    params:
      module: [http_check]
    static_configs:
      - targets:
          - https://ohmc.ar/
          - https://webmet.ohmc.ar/ 
          - https://wrf.ohmc.ar/  
          - https://estaciones.ohmc.ar/
          - https://epec.ohmc.ar/
          - https://yaku.ohmc.ar/
          - https://fuego.ohmc.ar/
          - https://reprommat.ohmc.ar/

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
rule_files:
  - /etc/prometheus/alert.rules.yml