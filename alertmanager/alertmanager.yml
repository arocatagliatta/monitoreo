global:
  resolve_timeout: 5m

route:
  receiver: "monitor"
  group_wait: 1m
  group_interval: 5m
  repeat_interval: 12h
  group_by: ['alertname', 'job', 'severity']

receivers:
  - name: "monitor"

    webhook_configs:
      - url: 'http://goalert:8081/api/v2/prometheusalertmanager/incoming?token=15ecd6d0-2f25-46e9-9a67-49cb8f380bdd'
        send_resolved: true

    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/1455230061212078223/vGwLhfBkyp8CEOHs8XmTNoe2h6VD2lyFzxeo7T-3tTEhMu91xuKIGf5wX_W32ESCyk-J"
        title: "[{{ .Status | toUpper }}] {{ if .CommonAnnotations.summary }}{{ .CommonAnnotations.summary }}{{ else }}{{ .CommonLabels.alertname }}{{ end }}"
        message: |
          **Servicio:** {{ .CommonLabels.job }}
          **Severidad:** {{ .CommonLabels.severity }}
          **Instancias afectadas ({{ .Alerts | len }}):**
          {{ range .Alerts -}}
          - {{ .Labels.instance }} {{ if .Annotations.description }}- {{ .Annotations.description }}{{ end }}
          {{ end -}}
