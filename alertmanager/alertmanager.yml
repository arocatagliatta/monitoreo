global:
  resolve_timeout: 10m

route:
  receiver: "monitor"
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 12h

receivers:
  - name: "monitor"

    webhook_configs:
      - url: 'http://goalert:8081/api/v2/prometheusalertmanager/incoming?token=15ecd6d0-2f25-46e9-9a67-49cb8f380bdd'
        send_resolved: true

    discord_configs:
      - webhook_url: "https://discord.com/api/webhooks/1455230061212078223/vGwLhfBkyp8CEOHs8XmTNoe2h6VD2lyFzxeo7T-3tTEhMu91xuKIGf5wX_W32ESCyk-J"
        title: "{{ .CommonAnnotations.summary }}"
        message: |
          {{ range .Alerts }}
          **Alerta:** {{ .Annotations.summary }}
          **Servicio:** {{ .Labels.job }}
          **Severidad:** {{ .Labels.severity }}
          **Estado:** {{ .Status }}
          {{ end }}

